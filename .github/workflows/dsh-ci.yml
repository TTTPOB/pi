name: DSH Pi AI CI

on:
  push:
    branches: [feat/final-tool-arguments]
  pull_request:
    branches: [feat/final-tool-arguments]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dsh-pi-ai-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcairo2-dev libpango1.0-dev libjpeg-dev libgif-dev librsvg2-dev

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Hydrate model data
        run: npm run hydrate:model-data

      - name: Check formatting and lint
        run: npx biome check packages/ai

      - name: Build Pi telemetry
        run: npm run build --workspace=@earendil-works/pi-telemetry

      - name: Build Pi AI
        run: npm run build:offline --workspace=@earendil-works/pi-ai

      - name: Test Pi AI
        run: npm test --workspace=@earendil-works/pi-ai
